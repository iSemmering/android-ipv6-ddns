<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPv6 DDNS</title>
<style>
:root {
  color-scheme: light;
  --accent: #2f54eb;
  --accent-on: var(--white);
  --ink: #18243c;
  --muted: #5d6c85;
  --line: #e1e7f0;
  --white: #fff;
  --page-bg: #f6f6f6;
  --settings-ink: #383838;
  --settings-muted: #737373;
  --settings-placeholder: #a6a6a6;
  --settings-divider: #eeeeee;
  --settings-chevron: #bdbdbd;
  --settings-error: #d9363e;
  --settings-input-ink: #1c1e1f;
  --field-ink: #435371;
  --field-border: #d5deec;
  --disabled-bg: #f3f5f9;
  --disabled-ink: #68758c;
  --success: #349e00;
  --pale: #f0f5ff;
  --accent-border: #adc6ff;
  --accent-deep: #1d39c4;
  --focus-color: var(--accent);
  --accent-disabled: var(--accent-border);
  --seconds-control-width: 92px;
  --toast-success-color: #52c41a;
  --toast-error-color: #ff4d4f;
  --toast-warning-color: #faad14;
  --switch-off: #c5cddd;
  --switch-shadow: #18243c30;
  --toast-shadow: 0 6px 16px rgb(0 0 0 / .08), 0 3px 6px -4px rgb(0 0 0 / .12), 0 9px 28px 8px rgb(0 0 0 / .05);
  --status-stopped-rgb: 125 142 165;
  --status-running-rgb: 13 163 125;
  --status-working-rgb: 221 132 39;
  --status-error-rgb: 216 76 108;
  --status-stopped-surface: #edf2f8;
  --status-running-surface: #d0f7e8;
  --status-working-surface: #fff3df;
  --status-error-surface: #fde8ee;
  --status-stopped-text: #34475f;
  --status-running-text: #0e4a3b;
  --status-working-text: #60360f;
  --status-error-text: #702a3d;
  --status-breath-duration: 2.4s;
  font: 15px/1.55 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
  background: var(--page-bg);
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input, select { font: inherit; }
button, select { cursor: pointer; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled, select:disabled { cursor: default; }
button:focus-visible {
  outline: 3px solid var(--focus-color);
  outline-offset: 2px;
}
[hidden] { display: none !important; }
h2, p { margin: 0; }
h2 { font-size: 16px; font-weight: 740; }
.stage {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  max-width: 484px;
  margin: 0 auto;
  padding: 28px 20px;
}
.app {
  display: flex;
  flex-direction: column;
  height: min(742px, calc(100vh - 56px));
  height: min(742px, calc(100dvh - 56px));
  min-height: 380px;
}
.tabs {
  --tab-gap: 4px;
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  flex: none;
  gap: var(--tab-gap);
  padding: 8px 16px max(8px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--white);
}
.tabs::before {
  content: "";
  position: absolute;
  z-index: -1;
  grid-column: 1 / 2;
  grid-row: 1 / 2;
  inset: 0;
  border-radius: 10px;
  background: var(--accent);
  pointer-events: none;
  transform: translateX(calc(var(--active-tab, 0) * (100% + var(--tab-gap))));
  transition: transform 280ms cubic-bezier(.2, .72, .24, 1);
}
.tabs button, .ghost, .choice, .secondary {
  min-height: 42px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-weight: 650;
}
.tabs button { transition: color 180ms ease; }
.tabs button[aria-selected="true"] { color: var(--accent-on); }
.choice[aria-pressed="true"] {
  background: var(--pale);
  color: var(--accent);
}
.panels {
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  scrollbar-width: thin;
  padding: 16px;
}
.panel, .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.section-group { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; min-width: 0; }
.section-heading { padding-inline: 2px; }
.card, .hero { padding: 15px; border-radius: 16px; }
.card { background: var(--white); border: 1px solid var(--line); }
.hero {
  --status-rgb: var(--status-stopped-rgb);
  --status-surface: var(--status-stopped-surface);
  --status-text: var(--status-stopped-text);
  position: relative;
  display: grid;
  gap: 14px;
  padding: 18px;
  color: var(--status-text);
  background-color: var(--status-surface);
  background-image: radial-gradient(ellipse at bottom right,
    rgb(var(--hero-gradient-rgb, var(--status-rgb)) / var(--hero-gradient-opacity, .20)), transparent 74%);
  box-shadow: inset 0 0 0 1px rgb(var(--status-rgb) / .18);
  transition: background-color .2s ease, color .2s ease;
}
.hero[data-tone="running"] {
  --status-rgb: var(--status-running-rgb);
  --status-surface: #d0f7df;
  --hero-gradient-rgb: 13 163 45;
  --hero-gradient-opacity: .66;
  --status-text: var(--status-running-text);
}
.hero[data-tone="working"] {
  --status-rgb: var(--status-working-rgb);
  --status-surface: var(--status-working-surface);
  --status-text: var(--status-working-text);
}
.hero[data-tone="error"] {
  --status-rgb: var(--status-error-rgb);
  --status-surface: var(--status-error-surface);
  --status-text: var(--status-error-text);
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.subtle { color: var(--muted); font-size: 13px; }
.hero .subtle { color: color-mix(in srgb, var(--status-text) 85%, var(--white)); }
.state { margin-top: 2px; font-size: 28px; font-weight: 760; letter-spacing: .02em; }
.hero-domain { display: flex; align-items: center; gap: 8px; color: var(--status-text); overflow-wrap: anywhere; }
.dot {
  --lamp-rgb: var(--status-rgb);
  position: relative;
  flex: 0 0 9px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgb(255 255 255 / .85),
    rgb(var(--lamp-rgb)) 55%, rgb(var(--lamp-rgb) / .72) 100%);
  box-shadow: 0 0 0 2px rgb(var(--lamp-rgb) / .22), 0 0 0 4px rgb(var(--lamp-rgb) / .09);
}
.hero:not([data-tone="stopped"]) .dot {
  animation: status-breathe var(--status-breath-duration) ease-in-out infinite;
}
.hero:not([data-tone="stopped"]) .dot::before {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgb(var(--lamp-rgb) / .24),
    rgb(var(--lamp-rgb) / .09) 48%, rgb(var(--lamp-rgb) / 0) 72%);
  animation: status-glow var(--status-breath-duration) ease-in-out infinite;
}
@keyframes status-breathe {
  0%, 100% { transform: scale(.86); opacity: .8; }
  50% { transform: scale(1.12); opacity: 1; }
}
@keyframes status-glow {
  0%, 100% { transform: scale(.82); opacity: .42; }
  50% { transform: scale(1.16); opacity: 1; }
}
.switch {
  flex: 0 0 49px;
  width: 49px;
  height: 29px;
  border: 0;
  border-radius: 20px;
  padding: 3px;
  background: var(--switch-off);
  transition: background .16s;
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch::before {
  content: "";
  display: block;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: var(--white);
  box-shadow: 0 1px 3px var(--switch-shadow);
  transition: transform .16s;
}
.switch[aria-checked="true"]::before {
  transform: translateX(20px);
  background: var(--accent-on);
}
.chip, .full-domain {
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  padding: 2px 7px;
  background: var(--pale);
  color: var(--accent);
  font-size: 12px;
}
.chip { white-space: nowrap; }
.address-value { flex: 1; min-width: 0; }
.address {
  display: block;
  color: var(--accent);
  font: 650 12px/1.55 ui-monospace, monospace;
  white-space: nowrap;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.address::-webkit-scrollbar { display: none; }
.address-line { display: flex; align-items: center; gap: 8px; padding-inline: 12px; }
.icon-button {
  display: grid;
  place-items: center;
  flex: none;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
}
.icon-button svg { width: 18px; height: 18px; }
.icon-button:disabled { color: var(--disabled-ink); opacity: .55; }
.copy-button { width: 28px; height: 28px; border-radius: 7px; }
.copy-button svg { width: 15px; height: 15px; }
.hero-domain #bound-domain { min-width: 0; }
.hero-domain .copy-button { width: 26px; height: 26px; color: var(--status-text); }
dl { margin: 0; display: grid; gap: 10px; }
dt { color: var(--muted); }
dd { margin: 0; text-align: right; font-weight: 640; overflow-wrap: anywhere; }
dl .row + .row { border-top: 1px solid var(--line); padding-top: 9px; }
.primary, .secondary, .choice {
  padding: 7px 12px;
  min-height: 43px;
}
.primary {
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-on);
  font-weight: 690;
}
.primary:disabled {
  background: var(--accent-disabled);
  color: var(--accent-on);
  cursor: not-allowed;
}
.secondary, .choice { border-color: var(--line); background: var(--white); color: var(--field-ink); }
.choice[aria-pressed="true"] { border-color: var(--accent); }
.ghost { min-height: 34px; padding: 4px 7px; color: var(--accent-deep); }
.loading-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.loading-button[aria-busy="true"]::before {
  content: "";
  box-sizing: border-box;
  flex: none;
  width: 14px;
  height: 14px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: button-spin .75s linear infinite;
}
@keyframes button-spin {
  to { transform: rotate(1turn); }
}
.wide { width: 100%; }
.choices { display: grid; gap: 8px; }
.settings-group {
  display: grid;
  min-width: 0;
  padding-inline: 14px;
  border-radius: 12px;
  background: var(--white);
  color: var(--settings-ink);
}
.settings-heading {
  display: flex;
  align-items: center;
  min-height: 48px;
  padding-block: 8px;
  border-bottom: 1px solid var(--settings-divider);
  font-weight: 700;
}
.setting-row {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  align-items: center;
  column-gap: 12px;
  min-height: 51px;
  padding-block: 4px;
  border-bottom: 1px solid var(--settings-divider);
}
.setting-row > .switch { justify-self: end; }
.setting-row > label, .setting-copy > label, .picker-trigger > span:first-child { font-weight: 300; }
.setting-row-with-description {
  grid-template-columns: minmax(0, 1fr) auto;
  padding-block: 8px;
}
.setting-description {
  color: var(--settings-placeholder);
  font-size: 13px;
  font-weight: lighter;
  line-height: 1.4;
}
.picker-trigger {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 42px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  text-align: left;
}
.setting-value {
  display: inline-flex;
  align-items: center;
  justify-content: end;
  min-width: 0;
  gap: 8px;
  color: var(--settings-muted);
  text-align: right;
  overflow-wrap: anywhere;
}
.picker-trigger > span:first-child { flex: none; }
.provider-symbols { position: absolute; }
.provider-icon {
  display: block;
  flex: none;
  width: 24px;
  height: 24px;
}
.setting-value .provider-icon { width: 20px; height: 20px; }
.chevron {
  flex: 0 0 7px;
  width: 7px;
  height: 7px;
  margin-right: 2px;
  border: solid var(--settings-chevron);
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(-45deg);
}
.settings-actions {
  display: grid;
  gap: 8px;
  padding-block: 12px 14px;
}
.field-error {
  grid-column: 2;
  padding-bottom: 3px;
  color: var(--settings-error);
  font-size: 12px;
  line-height: 1.4;
  text-align: right;
}
.picker-trigger + .field-error { grid-column: 1 / -1; }
.picker-option {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 8px 5px;
  border: 0;
  border-bottom: 1px solid var(--settings-divider);
  border-radius: 0;
  background: var(--white);
  color: var(--settings-ink);
  text-align: left;
}
@media (hover: hover) and (pointer: fine) {
  .icon-button:not(:disabled, .credential-toggle):hover { color: var(--accent-deep); background: var(--pale); }
  .hero-domain .copy-button:not(:disabled):hover {
    color: var(--status-text);
    background: rgb(var(--status-rgb) / .15);
  }
  .picker-option:not(:disabled):hover { background: var(--page-bg); }
}
.picker-option:focus-visible { outline-offset: -3px; }
.picker-option:disabled { color: var(--settings-placeholder); cursor: not-allowed; }
.picker-option:disabled .provider-icon { filter: saturate(.28); opacity: .78; }
.picker-label {
  min-width: 0;
  flex: 1;
  overflow-wrap: anywhere;
}
.picker-check {
  flex: 0 0 10px;
  width: 10px;
  height: 6px;
  margin-right: 3px;
  border: solid var(--accent);
  border-width: 0 0 2px 2px;
  transform: rotate(-45deg);
}
.field { display: grid; gap: 5px; font-weight: 610; min-width: 0; }
input:not([type=checkbox]), select {
  width: 100%;
  min-height: 43px;
  padding: 8px 10px;
  border: 1px solid var(--field-border);
  border-radius: 9px;
  background: var(--white);
  color: var(--ink);
}
input:not([type=checkbox]):focus, select:focus {
  border-color: var(--focus-color);
  outline: none;
  box-shadow: none;
}
input::placeholder { color: var(--muted); font-weight: 450; }
.settings-group .setting-row input:not([type=hidden]) {
  min-width: 0;
  min-height: 40px;
  padding: 4px 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--settings-input-ink);
  caret-color: #000;
  caret-shape: bar;
  text-align: right;
}
.settings-group .setting-row input::placeholder, .setting-placeholder {
  color: var(--settings-placeholder);
  font-weight: 400;
  opacity: 1;
}
.input-group {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.input-group input { flex: 1; }
.input-group .suffix { color: var(--settings-muted); }
.credential-input .credential-toggle {
  width: 40px;
  height: 40px;
  margin-inline-end: -6px;
  color: var(--settings-muted);
}
.credential-input .credential-toggle[data-revealed="true"] { color: var(--accent); }
.credential-toggle .eye-slash { display: none; }
.credential-toggle[data-revealed="true"] .eye-slash { display: block; }
.seconds-control {
  width: var(--seconds-control-width);
  max-width: 100%;
  justify-self: end;
}
.feedback {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  color: var(--success);
}
.feedback.error { color: var(--settings-error); }
.feedback .toast-icon { margin-top: 2px; }
.full-domain {
  padding: 8px 12px;
  overflow-wrap: anywhere;
  font-size: 14px;
  text-align: center;
}
.settings-group > .full-domain { margin-block: 10px 14px; }
.choices { grid-template-columns: repeat(3,minmax(0,1fr)); }
.choices .choice { padding-inline: 4px; }
.entries { list-style: none; margin: 0; padding: 0; }
.entries li { padding: 9px 0; }
.entries li + li { border-top: 1px solid var(--line); }
.entry-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.entry-dot {
  flex: 0 0 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--toast-warning-color);
}
.entries [data-severity="success"] .entry-dot { background: var(--toast-success-color); }
.entries [data-severity="error"] .entry-dot { background: var(--toast-error-color); }
.entry-meta time, .entry-duration { white-space: nowrap; }
.entry-duration { margin-inline-start: auto; text-align: right; }
.entries strong { font-size: 14px; }
.entries p { color: var(--muted); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.toast {
  position: fixed;
  z-index: 10;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  gap: 8px;
  width: max-content;
  max-width: min(360px, calc(100vw - 32px));
  border-radius: 8px;
  padding: 9px 12px;
  color: var(--ink);
  background: var(--white);
  box-shadow: var(--toast-shadow);
  font-size: 14px;
  overflow-wrap: anywhere;
  pointer-events: none;
}
.toast[data-tone="error"], .feedback.error { --toast-icon-color: var(--toast-error-color); }
.toast[data-tone="warning"] { --toast-icon-color: var(--toast-warning-color); }
.toast-icon {
  display: grid;
  place-items: center;
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  color: var(--white);
  background: var(--toast-icon-color, var(--toast-success-color));
}
.toast-icon svg { display: none; width: 11px; height: 11px; }
.toast[data-tone="success"] .toast-success-icon,
.feedback:not(.error) .toast-success-icon,
.toast[data-tone="error"] .toast-error-icon,
.feedback.error .toast-error-icon,
.toast[data-tone="warning"] .toast-warning-icon { display: block; }
dialog {
  width: min(88vw, 365px);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 17px;
}
dialog::backdrop { background: rgba(24, 36, 60, .42); }
dialog .row { justify-content: end; }
.bottom-sheet {
  position: fixed;
  inset: auto 0 0;
  margin: 0;
  width: 100%;
  max-width: none;
  max-height: min(78vh, 600px);
  max-height: min(78dvh, 600px);
  overflow: hidden;
  padding: 13px 16px max(16px, env(safe-area-inset-bottom));
  border-width: 1px 0 0;
  border-radius: 18px 18px 0 0;
  background: var(--white);
}
.bottom-sheet[open] {
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: sheet-arrive .22s cubic-bezier(.18, .76, .28, 1) both;
}
.sheet-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-options {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  min-height: 0;
  overflow-y: auto;
  border-top: 1px solid var(--settings-divider);
}
@keyframes sheet-arrive { from { transform: translateY(100%); } to { transform: translateY(0); } }
@media(max-width: 660px) {
  .stage { max-width: none; padding: 0; }
  .app {
    min-height: 0;
    height: 100vh;
    height: 100dvh;
  }
  .panels { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { transition: none !important; }
  .dot, .dot::before, .bottom-sheet[open],
  .loading-button[aria-busy="true"]::before { animation: none !important; }
}
</style>
</head>
<body>
<svg class="provider-symbols" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="icon-credential-eye" viewBox="0 0 24 24">
    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/>
    <circle cx="12" cy="12" r="2.5"/>

              <button class="icon-button credential-toggle" data-credential="sk" type="button" aria-label="显示 SK" aria-controls="sk">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <use href="#icon-credential-eye"/>
                  <path class="eye-slash" d="m4 4 16 16" stroke="var(--white)" stroke-width="4"/>
                  <path class="eye-slash" d="m4 4 16 16"/>
                </svg>
              </button>
            </div>
            <p id="sk-error" class="field-error" hidden></p>
          </div>
          <div class="settings-actions">
            <button id="fetch-zones" type="submit" class="primary wide loading-button">确定</button>
            <p id="key-result" class="feedback" role="status" hidden><span id="key-result-message"></span></p>
          </div>
        </form>

        <form id="settings" class="stack" novalidate>
          <section class="settings-group" aria-labelledby="domain-heading">
            <h2 id="domain-heading" class="settings-heading">域名绑定</h2>
            <input id="zone" type="hidden">
            <div class="setting-row">
              <button id="choose-zone" type="button" class="picker-trigger" aria-haspopup="dialog" aria-controls="picker-sheet" aria-describedby="choose-zone-error">
                <span>公网域名</span>
                <span class="setting-value"><span id="zone-value" class="setting-placeholder">选择域名</span><span class="chevron" aria-hidden="true"></span></span>
              </button>
              <p id="choose-zone-error" class="field-error" hidden></p>
            </div>
            <div class="setting-row">
              <label for="prefix">子域名前缀</label>
              <input id="prefix" maxlength="63" placeholder="例如 phone" required spellcheck="false" aria-describedby="prefix-error">
              <p id="prefix-error" class="field-error" hidden></p>
            </div>
            <div class="setting-row">
              <label for="ttl">TTL</label>
              <span class="input-group seconds-control">
                <input id="ttl" type="text" inputmode="numeric" pattern="[0-9]+" required aria-describedby="ttl-error">
                <span class="suffix">s</span>
              </span>
              <p id="ttl-error" class="field-error" hidden></p>
            </div>
            <p class="full-domain" id="full-domain" aria-live="polite" hidden></p>
          </section>

          <section class="settings-group" aria-labelledby="other-heading">
            <h2 id="other-heading" class="settings-heading">其他</h2>
            <div class="setting-row">
              <label for="interval">IPv6 检查间隔</label>
              <span class="input-group seconds-control">
                <input id="interval" type="text" inputmode="numeric" pattern="[0-9]+" required aria-describedby="interval-error">
                <span class="suffix">s</span>
              </span>
              <p id="interval-error" class="field-error" hidden></p>
            </div>
            <div class="setting-row setting-row-with-description">
              <div class="setting-copy">
                <label for="keep-data-on">始终开启流量</label>
                <p id="keep-data-on-description" class="setting-description">开启后，检查期间会重新打开移动数据开关</p>
              </div>
              <button id="keep-data-on" type="button" class="switch" role="switch" aria-checked="false" aria-describedby="keep-data-on-description"></button>
            </div>
            <div class="setting-row">
              <label for="airplane">飞行模式兜底</label>
              <button id="airplane" type="button" class="switch" role="switch" aria-checked="false" aria-label="飞行模式兜底"></button>
            </div>
          </section>

          <button type="submit" class="primary wide">保存配置</button>
        </form>
      </section>

      <section id="logs" class="panel" role="tabpanel" aria-labelledby="tab-logs" hidden>
        <div class="section-group">
          <div class="row section-heading"><h2>记录日志</h2><button id="logging" class="switch" role="switch" aria-checked="true" aria-label="记录日志"></button></div>
          <div class="card stack">
            <p class="subtle">保留时长</p>
            <div class="choices" aria-label="日志保留时长">
              <button class="choice" data-days="1" aria-pressed="false">1 天</button>
              <button class="choice" data-days="3" aria-pressed="true">3 天</button>
              <button class="choice" data-days="7" aria-pressed="false">7 天</button>
            </div>
          </div>
        </div>

        <div class="section-group">
          <h2 class="section-heading">运行记录</h2>
          <div class="card stack">
            <ol id="entries" class="entries"></ol>
            <p id="empty-logs" class="subtle" hidden>暂无运行记录</p>
            <button id="more-logs" class="secondary wide" type="button" hidden>加载更多</button>
          </div>
        </div>
      </section>
    </div>
    <nav class="tabs" role="tablist" aria-label="模块页面">
      <button id="tab-overview" role="tab" aria-controls="overview" aria-selected="true">概览</button>
      <button id="tab-config" role="tab" aria-controls="config" aria-selected="false">配置</button>
      <button id="tab-logs" role="tab" aria-controls="logs" aria-selected="false">日志</button>
    </nav>
  </main>

</div>
<div id="toast" class="toast" role="status" data-tone="success" hidden>
  <span class="toast-icon" aria-hidden="true">
    <svg class="toast-success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12 4 4 10-10"/>
    </svg>
    <svg class="toast-warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round">
      <path d="M12 6v7m0 4h.01"/>
    </svg>
    <svg class="toast-error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round">
      <path d="m6 6 12 12M18 6 6 18"/>
    </svg>
  </span>
  <span id="toast-message"></span>
</div>
<dialog id="picker-sheet" class="bottom-sheet" aria-labelledby="picker-title" closedby="closerequest">
  <div class="sheet-heading">
    <h2 id="picker-title"></h2>
    <button id="close-picker" class="icon-button" type="button" aria-label="关闭选择" title="关闭选择" autofocus>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18"/>
      </svg>
    </button>
  </div>
  <div id="picker-options" class="sheet-options"></div>
</dialog>
<dialog id="reuse">
  <form method="dialog" class="stack">
    <h2>选用已有 AAAA 记录</h2>
    <p id="reuse-domain" class="full-domain"></p>
    <p class="subtle">同步时会更新此记录的 IPv6 和 TTL。</p>
    <div class="row"><button value="cancel" class="secondary">返回</button><button value="use" class="primary">选用并保存</button></div>
  </form>
</dialog>

<script src="view.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
